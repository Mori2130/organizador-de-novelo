<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novelo – Meu estoque de linhas</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #F5F4FA;
      --card: #FFFFFF;
      --line: #E3E0EE;
      --ink: #241B3A;
      --mute: #5B5470;
      --acc: #B8305A;
      --acc-ink: #FFFFFF;
      --chip: #CFCAE0;
      --ok-bg: #DDF3E4;
      --ok: #1D5A33;
      --warn-bg: #FFE9C7;
      --warn: #7A4A00;
      color-scheme: light
    }

    [data-theme="dark"] {
      --bg: #16112A;
      --card: #1F1938;
      --line: #342C52;
      --ink: #EEEAF8;
      --mute: #B3ACCB;
      --acc: #F2799E;
      --acc-ink: #16112A;
      --chip: #4A4170;
      --ok-bg: #1E3B2A;
      --ok: #9BE3B3;
      --warn-bg: #443214;
      --warn: #FFD58A;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.45 'DM Sans', system-ui, sans-serif
    }

    h1,
    h2,
    .logo {
      margin: 0;
      font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif
    }

    h1 {
      font-size: clamp(26px, 5vw, 34px)
    }

    h2 {
      font-size: 24px
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px clamp(12px, 4vw, 48px);
      background: var(--card);
      border-bottom: 1px solid var(--line)
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: var(--acc)
    }

    main {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 28px;
      max-width: 1440px;
      margin: 0 auto;
      padding: clamp(16px, 4vw, 32px) clamp(12px, 4vw, 48px)
    }

    .lst {
      flex: 2 1 520px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    aside {
      flex: 1 1 320px;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    @media(max-width:900px) {
      aside {
        max-width: none;
        flex-basis: 100%
      }
    }

    .top,
    .chips {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 12px
    }

    .top {
      justify-content: space-between
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer
    }

    .pri {
      background: var(--acc);
      color: var(--acc-ink)
    }

    .ghost {
      background: var(--card);
      border-color: var(--chip);
      color: var(--ink)
    }

    .on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg)
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      align-items: end;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px
    }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px;
      color: var(--mute)
    }

    .form input,
    .form select {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--chip);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink)
    }

    .form input[type=color] {
      padding: 4px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      gap: 12px
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px
    }

    .dot {
      display: block;
      flex: none;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, .14);
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .28)
    }

    .nm {
      font-size: 18px;
      overflow-wrap: anywhere
    }

    .mu {
      font-size: 14px;
      color: var(--mute)
    }

    .sm {
      font-size: 13px;
      margin: 0
    }

    .stp {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 14px;
      color: var(--mute)
    }

    .stp div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--ink)
    }

    .stp b {
      font-size: 18px
    }

    .sb {
      width: 40px;
      height: 40px;
      border: 1px solid var(--chip);
      border-radius: 50%;
      background: var(--card);
      font-size: 20px;
      line-height: 1;
      cursor: pointer
    }

    .ft {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px
    }

    .lk {
      min-height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--mute);
      text-decoration: underline;
      cursor: pointer
    }

    .tag {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700
    }

    .ok {
      background: var(--ok-bg);
      color: var(--ok)
    }

    .warn {
      background: var(--warn-bg);
      color: var(--warn)
    }

    #list {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line)
    }

    .who {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .sh {
      display: flex;
      gap: 8px
    }

    .sh .btn {
      flex: 1;
      padding: 0 8px;
      font-size: 14px;
      border-color: var(--ink)
    }
  </style>
</head>

<body>
  <header class="bar">
    <span class="logo">Novelo</span>
    <button class="btn ghost" id="tm" data-a="tm" type="button">Modo noturno</button>
  </header>
  <main>
    <section class="lst">
      <div class="top">
        <h1>Meu estoque de linhas</h1>
        <button class="btn pri" data-a="add" type="button">+ Adicionar linha</button>
      </div>
      <form id="f" class="form" hidden>
        <label>Nome da cor<input id="nm" name="name" required maxlength="30"></label>
        <label>Cor<input name="color" type="color" value="#C4573A"></label>
        <label>Tipo<select name="type">
            <option>Algodão 4/6</option>
            <option>Amigurumi</option>
            <option>Barbante</option>
            <option>Outro</option>
          </select></label>
        <label>Tenho<input name="have" type="number" min="0" step="1" value="0"></label>
        <label>Preciso<input name="need" type="number" min="0" step="1" value="0"></label>
        <button class="btn pri" type="submit">Salvar linha</button>
      </form>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside>
      <h2>Lista de compras</h2>
      <div id="list"></div>
      <p class="mu sm">Os botões abrem a busca já preenchida em cada loja.</p>
    </aside>
  </main>
  <script>
    (function () {
      var KEY = 'novelo.v1';
      var TYPES = ['Algodão 4/6', 'Amigurumi', 'Barbante', 'Outro'];
      var seed = [
        { id: 1, name: 'Terracota', color: '#C4573A', type: 'Algodão 4/6', have: 3, need: 3 },
        { id: 2, name: 'Mostarda', color: '#D9A227', type: 'Algodão 4/6', have: 1, need: 2 },
        { id: 3, name: 'Cru', color: '#E8DCC4', type: 'Algodão 4/6', have: 2, need: 4 },
        { id: 4, name: 'Rosa', color: '#E58CA5', type: 'Amigurumi', have: 5, need: 0 },
        { id: 5, name: 'Azul-petróleo', color: '#2F6F7E', type: 'Amigurumi', have: 2, need: 0 },
        { id: 6, name: 'Verde-oliva', color: '#7A8450', type: 'Barbante', have: 4, need: 0 }
      ];
      var st = { y: seed, theme: null };
      var filter = 'Todas';
      function $(s) { return document.querySelector(s); }
      try { var raw = localStorage.getItem(KEY); if (raw) st = JSON.parse(raw); } catch (e) { }
      function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }

      function esc(s) {
        var m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(s).replace(/[&<>"']/g, function (c) { return m[c]; });
      }
      function slug(t) {
        return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function query(y) { return 'linha ' + (y.type === 'Outro' ? '' : y.type + ' ') + y.name; }
      function dot(c, s) { return '<span class="dot" style="width:' + s + 'px;height:' + s + 'px;background:' + esc(c) + '"></span>'; }

      function step(label, k, y) {
        var v = k === 'h' ? y.have : y.need;
        var n = label + ' ' + esc(y.name);
        return '<div class="stp"><span>' + label + '</span><div>' +
          '<button class="sb" type="button" data-a="' + k + '-" data-id="' + y.id + '" aria-label="Diminuir ' + n + '">−</button>' +
          '<b>' + v + '</b>' +
          '<button class="sb" type="button" data-a="' + k + '+" data-id="' + y.id + '" aria-label="Aumentar ' + n + '">+</button></div></div>';
      }
      function card(y) {
        var t = '';
        if (y.need > 0) t = y.need <= y.have ? '<span class="tag ok">Suficiente</span>' : '<span class="tag warn">Faltam ' + (y.need - y.have) + '</span>';
        return '<article class="card">' + dot(y.color, 48) +
          '<div><b class="nm">' + esc(y.name) + '</b><div class="mu">' + esc(y.type) + '</div></div>' +
          step('Tenho', 'h', y) + step('Preciso', 'n', y) +
          '<div class="ft">' + t + '<button class="lk" type="button" data-a="rm" data-id="' + y.id + '">Remover</button></div></article>';
      }
      function row(y) {
        var f = y.need - y.have, q = query(y), a = 'target="_blank" rel="noopener"';
        return '<div class="row"><div class="who">' + dot(y.color, 32) +
          '<div><b>' + esc(y.name) + '</b><div class="mu">' + esc(y.type) + ', ' + (f > 1 ? 'faltam ' + f + ' novelos' : 'falta 1 novelo') + '</div></div></div>' +
          '<div class="sh"><a class="btn ghost" ' + a + ' href="https://shopee.com.br/search?keyword=' + encodeURIComponent(q) + '">Shopee</a>' +
          '<a class="btn ghost" ' + a + ' href="https://lista.mercadolivre.com.br/' + slug(q) + '">Mercado Livre</a></div></div>';
      }

      function render() {
        var all = st.y;
        var vis = all.filter(function (y) { return filter === 'Todas' || y.type === filter; });
        var miss = all.filter(function (y) { return y.need > y.have; });
        $('#chips').innerHTML = ['Todas'].concat(TYPES).map(function (t) {
          return '<button class="btn ghost' + (t === filter ? ' on' : '') + '" type="button" data-a="f" data-v="' + t + '" aria-pressed="' + (t === filter) + '">' + t + '</button>';
        }).join('');
        $('#grid').innerHTML = vis.map(card).join('') || '<p class="mu">Nenhuma linha aqui ainda. Toque em “Adicionar linha”.</p>';
        $('#list').innerHTML = miss.map(row).join('') || '<p class="mu">Nada em falta. Defina quanto você precisa em cada linha para montar a lista.</p>';
      }

      function theme(t) {
        st.theme = t;
        document.documentElement.setAttribute('data-theme', t);
        $('#tm').textContent = t === 'dark' ? 'Modo claro' : 'Modo noturno';
      }

      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-a]');
        if (!b) return;
        var a = b.dataset.a, id = +b.dataset.id;
        var y = st.y.filter(function (x) { return x.id === id; })[0];
        if (a === 'add') { var f = $('#f'); f.hidden = !f.hidden; if (!f.hidden) $('#nm').focus(); return; }
        if (a === 'tm') { theme(st.theme === 'dark' ? 'light' : 'dark'); save(); return; }
        if (a === 'f') filter = b.dataset.v;
        else if (a === 'rm') st.y = st.y.filter(function (x) { return x.id !== id; });
        else if (y) { var k = a.charAt(0) === 'h' ? 'have' : 'need'; y[k] = Math.max(0, y[k] + (a.charAt(1) === '+' ? 1 : -1)); }
        save(); render();
      });

      $('#f').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        function d(n) { return f.elements[n].value; }
        st.y.push({ id: Date.now(), name: d('name').trim(), color: d('color'), type: d('type'), have: Math.max(0, +d('have') || 0), need: Math.max(0, +d('need') || 0) });
        f.reset(); f.hidden = true; save(); render();
      });

      theme(st.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      render();
    })();
  </script>
</body>

</html>
